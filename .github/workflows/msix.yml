name: Build MSIX

# Builds the Microsoft Store package from any branch or tag, without
# submitting it: for the first submission, which Partner Center only takes
# by hand, and for checking a package before a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Build the MSIX
        shell: bash
        run: dart run msix:create --output-path build/msix --output-name network-barcode-scanner

      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: build/msix/network-barcode-scanner.msix
          if-no-files-found: error
